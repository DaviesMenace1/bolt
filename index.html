<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Revamp UG — Luxury interior design, architecture, global sourcing, and white-glove installation. From inspiration to installation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title data-default>Revamp UG — Luxury Interior Design & Architecture</title>
    <style>
      html { background-color: #faf8f5; }
      html.dark { background-color: #2a2a2a; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        var theme = (stored === 'dark' || stored === 'light') ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
